name = "vc-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"

# "* * * * *" runs the reminder scheduler and the Google Calendar sync every minute.
# "0 6 * * 1" (Mondays 06:00 UTC) refreshes every connected Google sign-in once, so a revoked or expired one is found early (src/calendar-keepalive.js).
[triggers]
crons = ["* * * * *", "0 6 * * 1"]

[[d1_databases]]
binding = "DB"
database_name = "vc-bot"
# Replace with the id printed by `npx wrangler d1 create meeting-bot`.
# (Any placeholder works for local dev and tests.)
database_id = ""

# Meaning-based search for questions about long meetings (hybrid with keyword search). Create the index FIRST:
#   npx wrangler vectorize create vc-bot-chunks --dimensions=768 --metric=cosine
# Deploying fails until it exists. Both bindings are optional in the code: without them (or if either fails) questions
# are answered with keyword search alone. 768 dimensions matches the default model @cf/baai/bge-base-en-v1.5.
[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "vc-bot-chunks"

[vars]
DISCORD_API_BASE = "https://discord.com/api/v10"
# Google Calendar sign-in (/calendar connect) is configured with secrets, none of them set here:
#   npx wrangler secret put GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / TOKEN_ENC_KEY (32 random bytes, base64)
#   npx wrangler secret put GOOGLE_REDIRECT_URI   (must match, exactly, the redirect address saved on the OAuth client in Google Cloud Console)
# Do not also add any of these as a [vars] entry: a secret and a var with the same name make the deploy fail.
# /start-recording runs the recorder workflow in this repository. The token is a secret:
#   npx wrangler secret put GITHUB_DISPATCH_TOKEN   (fine-grained token, this repo only, "Actions: Read and write")
GITHUB_REPO = "SK-OTC/VC-bot"
GITHUB_REF = "main"
# Every saved transcript gets a private web link (https://<this worker>/t/<token>) that works for this many days.
# 0 turns the automatic links off.
SHARE_LINK_DAYS = "30"
# "Ask about this meeting" on the page is answered by Llama 3.3 70B on Workers AI (the [ai] binding above, no key needed),
# with Groq gpt-oss-120b as the fallback when Cloudflare errors (that needs the secret: npx wrangler secret put GROQ_API_KEY).
# Cloudflare's free allowance is 10,000 Neurons a day for the WHOLE account (summaries, answers and embeddings share it),
# reset at 00:00 UTC. The Worker keeps a daily meter and applies these soft caps:
QA_SOFT_CAP = "7000"        # at or over this many Neurons today, Q&A is paused until midnight UTC. 0 = skip Cloudflare, Groq only
SUMMARY_SOFT_CAP = "9500"   # the recorder uses Cloudflare for a summary only while today's total is under this
# Per-link limits (a failed attempt still counts):
QA_HOURLY_PER_LINK = "20"
QA_DAILY_PER_LINK = "100"
# QA_MODEL_ORDER = "cloudflare-gemma,groq-gpt-oss"   # the default; "cloudflare-llama,groq-gpt-oss" uses Llama 3.3 instead
# LLM_MODEL = "openai/gpt-oss-120b"                  # the Groq model
# Optional: the address to put in links if it differs from the one the recorder calls, e.g. your own domain.
# PUBLIC_URL = "https://meetings.example.com"
# The contact address on the public privacy page (/privacy) is set as a SECRET, so it is not committed to the repository:
#   npx wrangler secret put PRIVACY_CONTACT_EMAIL
# (It is still shown publicly on that page. Without it, the page tells people to ask the person who runs the bot.)
# DISCORD_PUBLIC_KEY is not secret, but keeping it in a secret avoids committing it:
#   npx wrangler secret put DISCORD_PUBLIC_KEY
#   npx wrangler secret put DISCORD_BOT_TOKEN
