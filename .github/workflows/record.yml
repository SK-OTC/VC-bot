name: Record meeting

# Started by the Cloudflare Worker (workflow_dispatch API call) or by hand: Actions tab > "Record meeting" > Run workflow.
# Run pages and logs of a public repo are public. Inputs below are only IDs. Team names, channel mapping and the
# glossary live in the TEAM_CONFIG secret. This job prints counts only and must never upload workflow artifacts.
on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: "Voice channel ID to record"
        required: true
      session_id:
        description: "Session ID (from the Worker; leave empty when running by hand)"
        required: false
        default: ""
      max_minutes:
        description: "Longest meeting in minutes (5 to 240). Empty = 150"
        required: false
        default: ""

permissions:
  contents: read

# One recording per voice channel at a time. A second run for the same channel waits instead of fighting for the bot.
concurrency:
  group: record-${{ inputs.channel_id }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    # Up to 15 min waiting + 150 min meeting + transcription. GitHub's own limit is 6 hours.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make sure ffmpeg is installed
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Offline checks
        run: npm test
      - name: Prepare the backup transcriber (installed in the background while recording)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Record, transcribe and post
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TEAM_CONFIG: ${{ secrets.TEAM_CONFIG }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          SESSION_ID: ${{ inputs.session_id }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
        run: |
          # Start installing faster-whisper (about 500 MB model downloads on first use). Output is discarded.
          "$RUNNER_TEMP/venv/bin/pip" install -q faster-whisper >/dev/null 2>&1 &
          node record.mjs
