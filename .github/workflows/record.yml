name: Record meeting

# Started by the Cloudflare Worker (workflow_dispatch API call) or by hand: Actions tab > "Record meeting" > Run workflow.
# Run pages and logs of a public repo are public. Inputs below are only IDs. Team names, channel mapping and the
# glossary are made with /setup-recording in Discord and fetched from the Worker while the job runs (the TEAM_CONFIG
# secret is only an optional fallback for runs started by hand). This job prints counts only and must never upload
# workflow artifacts.
on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: "Voice channel ID to record"
        required: true
      session_id:
        description: "Session ID (from the Worker; leave empty when running by hand)"
        required: false
        default: ""
      max_minutes:
        description: "Longest meeting in minutes (5 to 240). Empty = 150"
        required: false
        default: ""

permissions:
  contents: read

# One recording per voice channel at a time. A second run for the same channel waits instead of fighting for the bot.
concurrency:
  group: record-${{ inputs.channel_id }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    # Up to 15 min waiting + 150 min meeting + up to 120 min transcription budget (PARAKEET_BUDGET_MIN) + summary and
    # upload. GitHub's own limit is 6 hours (360 min), so 345 leaves a 15 minute margin. If the job is cancelled at the
    # limit the recorder leaves WITHOUT a transcript and the audio on the runner is lost, so keep MAX_MINUTES at 150.
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make sure ffmpeg is installed
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Offline checks
        run: npm test
      - name: Install Parakeet, the main transcriber (onnx-asr, pinned to the version it was tested with)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "onnx-asr[cpu,hub]==0.12.0"
      - name: Parakeet worker checks
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest pipeline.test_parakeet_worker'
      # The model (about 660 MB) is downloaded from Hugging Face at run time. The cache key is the hash of
      # pipeline/parakeet-model.json, which pins the exact model revision, so changing the revision refreshes the cache.
      - name: Cache the Parakeet model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/parakeet-v2-int8
          key: parakeet-${{ hashFiles('pipeline/parakeet-model.json') }}
      - name: Record, transcribe and post
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Summary models: Gemma 4 then gpt-oss-120b on Cloudflare, Groq last. The token needs "Workers AI" permission only.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A repository VARIABLE (Settings > Secrets and variables > Actions > Variables), not a secret: variables are
          # public in a public repo, so it holds only model names. Empty means the default: cloudflare-gemma,cloudflare-gpt-oss,groq-gpt-oss
          SUMMARY_MODEL_ORDER: ${{ vars.SUMMARY_MODEL_ORDER }}
          TEAM_CONFIG: ${{ secrets.TEAM_CONFIG }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          SESSION_ID: ${{ inputs.session_id }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          # Transcription engines. Repository VARIABLES (public in a public repo, so names and numbers only, never secrets).
          # ENGINE_ORDER empty means the default "parakeet,groq"; set "groq,parakeet" to flip. PARAKEET_BUDGET_MIN empty means 120.
          ENGINE_ORDER: ${{ vars.ENGINE_ORDER }}
          PARAKEET_BUDGET_MIN: ${{ vars.PARAKEET_BUDGET_MIN }}
          PARAKEET_PYTHON: ${{ runner.temp }}/venv/bin/python
          PARAKEET_MODEL_DIR: ${{ github.workspace }}/.cache/parakeet-v2-int8
        run: node recorder/record.mjs
